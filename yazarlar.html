<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yazarlar - Edebiyat Gündemi</title>
    <style>
        :root { --bg-color: #0b111e; --card-bg: #131a28; --gold-accent: #cda962; --text-light: #e0e6ed; }
        body { background-color: var(--bg-color); color: var(--text-light); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px 20px; }
        
        .page-title { text-align: center; font-family: 'Playfair Display', serif; color: var(--gold-accent); font-size: 2.5rem; margin-bottom: 50px; border-bottom: 1px solid rgba(205, 169, 98, 0.2); padding-bottom: 20px; }
        
        .authors-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; }
        
        /* YAZAR BANNER KARTI */
        .author-banner { background-color: var(--card-bg); border-radius: 12px; padding: 40px 20px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; transition: all 0.3s ease; text-decoration: none; display: block; }
        .author-banner:hover { transform: translateY(-10px); border-color: var(--gold-accent); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .author-banner img { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; border: 3px solid var(--gold-accent); margin-bottom: 20px; }
        .author-banner h2 { font-family: 'Playfair Display', serif; color: #fff; font-size: 1.8rem; margin: 0 0 10px 0; }
        .author-banner p { color: var(--gold-accent); font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; margin: 0; }
    </style>
</head>
<body>

    <h1 class="page-title">Köşe Yazarları</h1>

    <div class="authors-grid">
        <!-- TOLGA ÖZDOĞAN BANNER'I (Tıklayınca Profil Sayfasına Gider) -->
        <a href="tolga-ozdogan.html" class="author-banner">
            <img src="images/Tolga 2.png" alt="Tolga Özdoğan">
            <h2>TOLGA ÖZDOĞAN</h2>
            <p>YAZAR</p>
        </a>

        <!-- İleride buraya başka yazarlar eklenebilir -->
    </div>

</body>
</html>
