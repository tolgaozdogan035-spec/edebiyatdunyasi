<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yazarlar - Edebiyat Gündemi</title>
    <style>
        body { 
            background-color: #f8f9fa; /* Aydınlık arka plan */
            color: #2c3e50; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 40px 20px; 
            margin: 0;
        }
        
        .page-header { 
            text-align: center; 
            margin-bottom: 50px; 
        }
        .page-title { 
            font-family: 'Georgia', serif; 
            color: #1a2b4c; /* Kurumsal lacivert */
            font-size: 2.2rem; 
            margin-bottom: 10px;
        }
        .title-divider {
            width: 60px;
            height: 3px;
            background-color: #cda962; /* Zarif gold detay */
            margin: 0 auto;
        }
        
        .authors-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 30px; 
            max-width: 1100px; 
            margin: 0 auto; 
        }
        
        /* YAZAR KUTUSU (Aydınlık Tema) */
        .author-card { 
            background-color: #ffffff; 
            border-radius: 8px; 
            padding: 40px 20px; 
            text-align: center; 
            border: 1px solid #e1e5eb; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            cursor: pointer; 
            transition: all 0.3s ease; 
            text-decoration: none; 
            display: block; 
        }
        .author-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 8px 25px rgba(0,0,0,0.1); 
            border-color: #cda962;
        }
        
        .author-card img { 
            width: 140px; 
            height: 140px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid #f0f2f5; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .author-card h2 { 
            font-family: 'Georgia', serif; 
            color: #1a2b4c; 
            font-size: 1.5rem; 
            margin: 0 0 8px 0; 
        }
        .author-card p { 
            color: #cda962; 
            font-size: 0.85rem; 
            font-weight: 600;
            letter-spacing: 1.5px; 
            text-transform: uppercase; 
            margin: 0; 
        }
    </style>
</head>
<body>

    <div class="page-header">
        <h1 class="page-title">Köşe Yazarları</h1>
        <div class="title-divider"></div>
    </div>

    <div class="authors-grid">
        <!-- TOLGA ÖZDOĞAN KUTUSU -->
        <a href="tolga-ozdogan.html" class="author-card">
            <!-- Boşluk hatasını çözmek için %20 kullanıldı -->
            <img src="images/Tolga%202.png" onerror="this.src='images/tolga_ozdogan.png'" alt="Tolga Özdoğan">
            <h2>Tolga Özdoğan</h2>
            <p>Yazar</p>
        </a>
    </div>

</body>
</html>
