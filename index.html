<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edebiyat Gündemi - Ana Sayfa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- GENEL TEMA VE RENKLER --- */
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --navy-blue: #1a2b4c;
            --gold-accent: #cda962;
            --text-dark: #2c3e50;
            --text-muted: #6c757d;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-dark); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0;
            line-height: 1.6;
        }

        /* --- ÜST BİLGİ (HEADER) VE MENÜ --- */
        header { 
            background-color: var(--navy-blue); 
            padding: 30px 0 20px; 
            text-align: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        header h1 { 
            font-family: 'Georgia', serif; 
            color: var(--gold-accent); 
            margin: 0 0 15px 0; 
            font-size: 2.5rem; 
            letter-spacing: 1px; 
        }

        nav { 
            display: flex; 
            justify-content: center; 
            gap: 30px; 
            flex-wrap: wrap;
        }
        
        nav a { 
            color: #ffffff; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 0.95rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            transition: color 0.3s ease; 
        }
        
        nav a:hover, nav a.active { 
            color: var(--gold-accent); 
        }

        /* --- ŞIK BANNER ALANLARI --- */
        .banner-container {
            width: 100%;
            max-width: 970px;
            margin: 40px auto;
            text-align: center;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .banner-container:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .banner-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- HABER KARTLARI (GRID YAPI) --- */
        .news-grid { 
            max-width: 1200px; 
            margin: 0 auto; 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); 
            gap: 40px; 
            padding: 0 20px; 
        }
        
        .news-card { 
            background: var(--card-bg); 
            border-radius: 10px; 
            overflow: hidden; 
            border: 1px solid #e1e5eb; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
            display: flex;
            flex-direction: column;
        }
        
        .news-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 12px 30px rgba(0,0,0,0.08); 
            border-color: var(--gold-accent); 
        }

        .news-img { 
            width: 100%; 
            height: 220px; 
            object-fit: cover; 
            border-bottom: 3px solid var(--gold-accent); 
        }

        .news-content { 
            padding: 25px; 
            flex-grow: 1;
        }

        .news-meta { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 0.8rem; 
            color: var(--text-muted); 
            margin-bottom: 15px; 
            text-transform: uppercase; 
            font-weight: 700; 
            letter-spacing: 1px;
        }
        
        .news-source { 
            background-color: #f0f2f5; 
            color: var(--navy-blue); 
            padding: 4px 10px; 
            border-radius: 4px; 
        }

        .news-title { 
            font-family: 'Georgia', serif; 
            font-size: 1.4rem; 
            color: var(--navy-blue); 
            margin: 0 0 15px 0; 
            line-height: 1.4; 
        }

        .news-text { 
            font-size: 0.95rem; 
            color: #555; 
        }
        
        .news-text p {
            margin-bottom: 15px;
        }

        /* --- ALT BİLGİ (FOOTER) --- */
        footer {
            background-color: var(--navy-blue);
            color: #fff;
            text-align: center;
            padding: 20px 0;
            margin-top: 40px;
            font-size: 0.9rem;
        }

        #loading { 
            text-align: center; 
            padding: 60px 20px; 
            font-size: 1.2rem; 
            color: var(--text-muted); 
        }
    </style>
</head>
<body>

    <!-- ÜST MENÜ -->
    <header>
        <h1>Edebiyat Gündemi</h1>
        <nav>
            <a href="index.html" class="active">Ana Sayfa</a>
            <a href="soylesiler.html">Söyleşiler</a>
            <a href="yazarlar.html">Yazarlar</a>
        </nav>
    </header>

    <!-- BANNER 1 (ÜST REKLAM: LEYLA YASAK MEVSİM) -->
    <div class="banner-container">
        <a href="https://www.kitapyurdu.com/kitap/leyla-yasak-mevsim/764961.html?manufacturer_id=296396" target="_blank" rel="noopener noreferrer">
            <img src="images/Banner-1.jfif" alt="Leyla Yasak Mevsim - Tolga Özdoğan">
        </a>
    </div>

    <!-- HABERLERİN YÜKLENDİĞİ ANA ALAN -->
    <main>
        <div id="loading"><i class="fas fa-spinner fa-spin"></i> Ulusal kültür sanat kaynakları taranıyor, haberler yükleniyor...</div>
        <div class="news-grid" id="news-grid">
            <!-- JavaScript ile haberler buraya basılacak -->
        </div>
    </main>

    <!-- BANNER 2 (ALT REKLAM: KAOSUN MİMARI İNSAN) -->
    <div class="banner-container">
        <a href="https://www.kitapyurdu.com/kitap/kaosun-mimari-insan/762120.html?manufacturer_id=296396" target="_blank" rel="noopener noreferrer">
            <img src="images/Banner-2.jfif" alt="Kaosun Mimarı İnsan - Tolga Özdoğan">
        </a>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Edebiyat Gündemi. Tüm Hakları Saklıdır.</p>
    </footer>

    <!-- JSON DOSYASINI OKUYAN KOD -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Tarayıcı önbelleğini kırmak için getTime eklendi
            fetch('haberler/haberler.json?v=' + new Date().getTime())
                .then(response => {
                    if (!response.ok) throw new Error("JSON dosyası bulunamadı.");
                    return response.json();
                })
                .then(data => {
                    const grid = document.getElementById('news-grid');
                    const loading = document.getElementById('loading');
                    
                    loading.style.display = 'none'; // Yükleniyor yazısını gizle
                    
                    if (!data || data.length === 0) {
                        grid.innerHTML = '<p style="text-align:center; width:100%; color:#555;">Şu an için gösterilecek haber bulunmuyor.</p>';
                        return;
                    }

                    data.forEach(news => {
                        const card = document.createElement('div');
                        card.className = 'news-card';
                        
                        // Varsayılan kapak resmi ataması (Resim kırıksa varsayılan yüklenir)
                        const imageHtml = `
                            <img src="${news.image}" alt="${news.title}" class="news-img" 
                                 onerror="this.src='https://images.unsplash.com/photo-1506880018603-83d5b814b5a6?auto=format&fit=crop&w=1200&q=80'">
                        `;

                        card.innerHTML = `
                            ${imageHtml}
                            <div class="news-content">
                                <div class="news-meta">
                                    <span class="news-source"><i class="fas fa-book-reader"></i> ${news.source}</span>
                                    <span>${news.date}</span>
                                </div>
                                <h2 class="news-title">${news.title}</h2>
                                <div class="news-text">${news.content}</div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                })
                .catch(error => {
                    document.getElementById('loading').innerHTML = `
                        <div style="color:#e74c3c; font-weight:bold;">
                            <i class="fas fa-exclamation-triangle"></i> Haberler sunucudan çekilirken bir hata oluştu. Lütfen sayfayı yenileyin.
                        </div>`;
                    console.error("Haber yükleme hatası:", error);
                });
        });
    </script>
</body>
</html>
