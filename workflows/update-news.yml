name: Otomatik Haber Güncelleyici

on:
  schedule:
    - cron: '0 */3 * * *' # Her 3 saatte bir çalışır
  workflow_dispatch: # Manuel olarak da tetiklenebilir

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          pip install feedparser beautifulsoup4 requests

      - name: Botu Çalıştır (Haberleri Çek)
        run: |
          python scraper.py

      - name: Değişiklikleri GitHub'a Otomatik Kaydet
        run: |
          git config --global user.name "Haber Botu"
          git config --global user.email "bot@users.noreply.github.com"
          git add haberler/haberler.json
          git commit -m "Otomatik haber güncellemesi: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push