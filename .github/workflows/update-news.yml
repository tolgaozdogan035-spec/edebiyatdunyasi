name: Edebiyat Gündemi Otomatik Bot

on:
  schedule:
    # Botun her 15 dakikada bir çalışmasını sağlar (Sitelere aşırı yüklenip engellenmemek için 15 dakika idealdir)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Manuel tetikleme butonu ekler

permissions:
  contents: write # Botun haberleri depoya kaydetmesi için zorunlu yazma izni

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v3

      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.12' # Can sıkan sarı uyarıyı kapatmak için 3.12 yapıldı

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 requests google-api-python-client google-auth

      - name: Scraper Botunu Çalıştır
        run: |
          python scraper.py

      - name: Değişiklikleri Git Deposuna Kaydet ve Gönder
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git status
          # DİKKAT: Yeni oluşturulan tolga_yazilari.json dahil tüm dosyaları KESİN OLARAK ekler
          git add --all
          # Çakışma hatalarını (failed to push refs) engellemek için pull --rebase eklendi
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik Edebiyat ve Yazar Arşivi Güncellemesi [skip ci]" && git pull --rebase origin main && git push)
