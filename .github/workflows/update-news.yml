name: Edebiyat Gündemi Otomatik Bot

on:
  schedule:
    # Botun her 15 dakikada bir çalışmasını sağlar (Sitelere aşırı yüklenip engellenmemek için 15 dakika idealdir)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Manuel tetikleme butonu ekler

permissions:
  contents: write # Botun haberleri depoya kaydetmesi için zorunlu yazma izni

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v3

      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 requests google-api-python-client google-auth deep-translator

      - name: Scraper Botunu Çalıştır
        run: |
          python scraper.py

      - name: Değişiklikleri Git Deposuna Kaydet ve Gönder
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git status
          git add haberler/haberler.json haberler/soylesiler.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik Tam Metin ve Çeviri Güncellemesi [skip ci]" && git push)
